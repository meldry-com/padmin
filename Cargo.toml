[package]
name = "padmin"
version = "0.1.0"
authors = ["Meldry Team"]
license = "AGPL-3.0-or-later"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glory = { path = "../../glory-rs/glory/crates/glory", features = ["web", "ssr"] }
sapid = { path = "../../glory-rs/sapid" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.27"
gloo-net = { version = "0.7", features = ["http", "json"] }
gloo-timers = { version = "0.4", features = ["futures"] }
web-sys = { version = "=0.3.106", features = [
    "Window",
    "KeyboardEvent",
    "MouseEvent",
    "HtmlInputElement",
    "File",
    "FileList",
    "Document",
    "HtmlDocument",
    "HtmlElement",
    "Location",
    "Storage",
    "MediaQueryList",
    "Url",
    "UrlSearchParams",
    "Headers",
    "RequestInit",
    "Request",
    "Response",
    "RequestCredentials",
    "RequestMode",
    "DomTokenList",
    "Element",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Crypto",
    "SubtleCrypto",
    "EventTarget",
    "Event",
    "History",
    "PopStateEvent",
] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
chrono = { version = "0.4.44", features = ["serde", "wasmbind"] }
urlencoding = "2.1.3"
log = "0.4.29"
regex-lite = "0.1.9"
futures = "0.3.31"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = true
