[package]
name = "padmin"
version = "0.1.0"
authors = ["Meldry Team"]
license = "AGPL-3.0-or-later"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.5", features = ["web", "router"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
gloo-net = { version = "0.7", features = ["http", "json"] }
gloo-storage = "0.4.0"
gloo-timers = { version = "0.4", features = ["futures"] }
gloo-utils = "0.3.0"
web-sys = { version = "0.3.95", features = [
    "Window",
    "Document",
    "HtmlDocument",
    "HtmlElement",
    "Location",
    "Storage",
    "MediaQueryList",
    "Url",
    "UrlSearchParams",
    "Headers",
    "RequestInit",
    "Request",
    "Response",
    "RequestCredentials",
    "RequestMode",
    "DomTokenList",
    "Element",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Crypto",
    "SubtleCrypto",
] }
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4.68"
js-sys = "0.3.95"
chrono = { version = "0.4.44", features = ["serde", "wasmbind"] }
urlencoding = "2.1.3"
log = "0.4.29"
dioxus-logger = "0.7.4"
regex-lite = "0.1.9"
