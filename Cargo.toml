[package]
name = "padmin"
version = "0.1.0"
license = "AGPL-3.0-or-later"
edition = "2024"

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.7", features = ["http", "json"] }
gloo-storage = "0.4"
gloo-timers = { version = "0.4", features = ["futures"] }
gloo-utils = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlDocument",
    "HtmlElement",
    "Location",
    "Storage",
    "MediaQueryList",
    "Url",
    "UrlSearchParams",
    "Headers",
    "RequestInit",
    "Request",
    "Response",
    "RequestCredentials",
    "RequestMode",
    "DomTokenList",
    "Element",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Crypto",
    "SubtleCrypto",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
urlencoding = "2"
log = "0.4"
dioxus-logger = "0.7"
regex-lite = "0.1"
