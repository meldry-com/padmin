name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve image names
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ gitea.repository }}
          SERVER_URL: ${{ gitea.server_url }}
          EVENT_NAME: ${{ gitea.event_name }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail

          repo_name="${REPOSITORY#*/}"
          registry_host="${SERVER_URL#http://}"
          registry_host="${registry_host#https://}"
          registry_host="${registry_host%%/*}"
          gitea_image="$registry_host/$REPOSITORY"
          use_gitea_registry="false"
          use_dockerhub="false"

          images=()

          if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_TOKEN:-}" ]; then
            use_gitea_registry="true"
            images+=("$gitea_image")
          fi

          if [ -n "${DOCKERHUB_USER:-}" ]; then
            dockerhub_namespace="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USER}"
            dockerhub_image="$dockerhub_namespace/$repo_name"
            use_dockerhub="true"
            images+=("$dockerhub_image")
          else
            dockerhub_image=""
          fi

          if [ "${#images[@]}" -eq 0 ]; then
            images=("local/$repo_name")
            push_images="false"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            push_images="false"
          else
            push_images="true"
          fi

          {
            echo "gitea_registry=$registry_host"
            echo "gitea_registry_user=${REGISTRY_USER:-}"
            echo "gitea_image=$gitea_image"
            echo "use_gitea_registry=$use_gitea_registry"
            echo "use_dockerhub=$use_dockerhub"
            echo "dockerhub_image=$dockerhub_image"
            echo "push_images=$push_images"
            echo "images<<EOF"
            printf "%s\n" "${images[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        if: steps.image.outputs.push_images == 'true' && steps.image.outputs.use_gitea_registry == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.gitea_registry }}
          username: ${{ steps.image.outputs.gitea_registry_user }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.image.outputs.push_images == 'true' && steps.image.outputs.use_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ steps.image.outputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
