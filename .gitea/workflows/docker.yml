name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve image names
        id: image
        shell: sh
        env:
          REPOSITORY: ${{ gitea.repository }}
          SERVER_URL: ${{ gitea.server_url }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -eu

          repo_name="${REPOSITORY#*/}"
          registry_host="${SERVER_URL#http://}"
          registry_host="${registry_host#https://}"
          registry_host="${registry_host%%/*}"
          dockerhub_namespace="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"

          if [ -z "$REGISTRY_USERNAME" ]; then
            echo "vars.REGISTRY_USERNAME is required for Gitea registry login." >&2
            exit 1
          fi

          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "vars.DOCKERHUB_USERNAME is required for Docker Hub login." >&2
            exit 1
          fi

          {
            echo "registry_username=$REGISTRY_USERNAME"
            echo "gitea_registry=$registry_host"
            echo "gitea_image=$registry_host/$REPOSITORY"
            echo "dockerhub_username=$DOCKERHUB_USERNAME"
            echo "dockerhub_image=$dockerhub_namespace/$repo_name"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        if: gitea.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.gitea_registry }}
          username: ${{ steps.image.outputs.registry_username }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Log in to Docker Hub
        if: gitea.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.image.outputs.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image.outputs.gitea_image }}
            ${{ steps.image.outputs.dockerhub_image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ gitea.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
