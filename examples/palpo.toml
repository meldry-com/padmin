# Palpo Matrix Homeserver configuration
# Adjust server_name to your domain before deploying.

server_name = "localhost"

max_upload_size = 20_000_000

allow_registration = false

trusted_servers = ["matrix.org"]

[[listeners]]
address = "0.0.0.0:8008"

[presence]
allow_local = true

[federation]
enable = false

[db]
url = "postgres://palpo:changeme@postgres:5432/palpo"
pool_size = 10

# The `server` delegation MUST include a port. Without one, peer homeservers
# fall back to the Matrix default federation port (8448) per the server-resolution
# spec. This all-in-one example serves everything on 8008, so advertise that port.
[well_known]
server = "localhost:8008"
client = "http://localhost:8008"

[admin]
mas_secret = "replace-with-a-random-secret"

[delegated_auth]
enable = true
issuer = "http://localhost:7080/"
introspection_endpoint = "http://pasion:7080/oauth2/introspect"
client_id = "01KMQE9VZQ33VQT9GP1WA4265X"
