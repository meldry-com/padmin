# Pasion OAuth 2.0 / OIDC authentication service configuration
# Adjust secrets and matrix settings before deploying.

http:
  listeners:
    - name: web
      resources:
        - name: discovery
        - name: human
        - name: oauth
        - name: compat
        - name: restapi
        - name: adminapi
        - name: assets
      binds:
        - address: "[::]:7080"
      proxy_protocol: false
  trusted_proxies:
    - 192.168.0.0/16
    - 172.16.0.0/12
    - 10.0.0.0/10
    - 127.0.0.1/8
    - fd00::/8
    - "::1/128"
  public_base: http://localhost:7080/
  issuer: http://localhost:7080/

database:
  uri: postgresql://palpo:changeme@postgres:5432/pasion
  max_connections: 10
  min_connections: 0
  connect_timeout: 30
  idle_timeout: 600
  max_lifetime: 1800

matrix:
  kind: palpo
  homeserver: localhost
  secret: replace-with-a-random-secret
  endpoint: http://palpo:8008/

secrets:
  encryption: 0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b
  keys:
    - key_file: /keys/pasion-signing-key.pem

passwords:
  enabled: true
  schemes:
    - version: 1
      algorithm: argon2id
  minimum_complexity: 3

account:
  password_registration_enabled: true
  password_recovery_enabled: true

policy:
  data:
    client_registration:
      allow_insecure_uris: true

clients:
  - client_id: 01KMQE9VZQ33VQT9GP1WA4265X
    client_auth_method: none
    client_name: Palpo Homeserver
    redirect_uris:
      - http://localhost:8080/

  - client_id: 01KMQPADM1N000000000000000
    client_auth_method: none
    client_name: Palpo Admin Dashboard
    redirect_uris:
      - http://localhost:7060/oauth/callback

upstream_oauth2:
  providers:
    - id: 01KMQDVNFWTRF9K8FV8FCFKARM
      human_name: GitHub
      brand_name: github
      issuer: https://github.com
      discovery_mode: disabled
      authorization_endpoint: https://github.com/login/oauth/authorize
      token_endpoint: https://github.com/login/oauth/access_token
      userinfo_endpoint: https://api.github.com/user
      client_id: Ov23liLxWajlmnu6XhrQ
      client_secret: ed1a0321da2657533106776d492316ae4a2ac30c
      token_endpoint_auth_method: client_secret_post
      scope: read:user user:email
      fetch_userinfo: true
      claims_imports:
        # Skip the registration confirmation screen — every claim below is
        # either required or forced, so there's nothing for the user to edit.
        skip_confirmation: true
        subject:
          template: "{{ user.id }}"
        localpart:
          action: require
          template: "{{ user.login }}"
        displayname:
          action: force
          template: "{{ user.name }}"
        email:
          action: force
          template: "{{ user.email }}"
        avatar:
          action: force
          template: "{{ user.avatar_url }}"

email:
  from: '"Pasion" <chris@acroidea.com>'
  reply_to: '"Pasion" <chris@acroidea.com>'
  transport: smtp
  mode: tls
  hostname: smtp.gmail.com
  port: 465
  username: chris@acroidea.com
  password: "mxmpeswvvqpliupb"

storage:
  backend: fs
  root: /data/media

sms:
  transport: blackhole
