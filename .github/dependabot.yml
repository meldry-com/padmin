version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Update these coordinated git/patch/CI pins together after local UI acceptance.
    ignore:
      - dependency-name: glory
      - dependency-name: sapid
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
