name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  PADMIN_REMOTE_BUILD: '1'
  PADMIN_BUILD_ROOT: ${{ github.workspace }}/build-cache/padmin-glory
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/meldry/padmin

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: meldry/padmin

      - name: Check out Glory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glory-rs/glory
          ref: b9d06545c701510ba18d5cdb7cd363c102cad906
          path: glory-rs/main/glory

      - name: Check out Sapid
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sapid-ui/sapid
          ref: c5c4e23aeb6d37b3f2537545116bac43dbb40a64
          path: glory-rs/main/sapid

      - name: Build Glory and Sapid WASM on remote runner
        working-directory: meldry/padmin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PADMIN_BUILD_ROOT/tmp" "$PADMIN_BUILD_ROOT/cargo"
          export CARGO_HOME="$PADMIN_BUILD_ROOT/cargo"
          export CARGO_TARGET_DIR="$PADMIN_BUILD_ROOT/target"
          export TMPDIR="$PADMIN_BUILD_ROOT/tmp"
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          cargo install wasm-bindgen-cli --version 0.2.129 --locked --root "$PADMIN_BUILD_ROOT/tools"
          export WASM_BINDGEN="$PADMIN_BUILD_ROOT/tools/bin/wasm-bindgen"
          cargo metadata --locked --format-version 1 > "$PADMIN_BUILD_ROOT/canonical-metadata.json"
          python3 scripts/glory.py check
          python3 scripts/glory.py test
          python3 scripts/glory.py build
          mkdir -p "$PADMIN_BUILD_ROOT/container"
          cp -R "$PADMIN_BUILD_ROOT/dist" "$PADMIN_BUILD_ROOT/container/dist"
          cp Dockerfile docker-entrypoint.sh "$PADMIN_BUILD_ROOT/container/"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Smoke test runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --tag padmin-smoke "$PADMIN_BUILD_ROOT/container"

          run_case() {
            local name="$1"
            shift

            local cid
            cid="$(docker run -d --name "$name" "$@" padmin-smoke)"

            sleep 2

            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              docker logs "$cid"
              exit 1
            fi

            docker exec "$cid" nginx -t

            case "$name" in
              padmin-no-pasion)
                docker exec "$cid" sh -c "! grep -Fq 'location ^~ /auth/' /etc/nginx/conf.d/default.conf"
                ;;
              padmin-with-pasion)
                docker exec "$cid" grep -q 'https://auth.example.com' /usr/share/nginx/html/config.json
                docker exec "$cid" grep -Fq 'location ^~ /auth/' /etc/nginx/conf.d/default.conf
                ;;
            esac

            docker rm -f "$cid" >/dev/null
          }

          run_case padmin-no-pasion \
            -e PALPO_URL=http://palpo:8008

          run_case padmin-with-pasion \
            -e PALPO_URL=http://palpo:8008 \
            -e PASION_URL=http://pasion:7080 \
            -e PASION_PUBLIC_URL=https://auth.example.com

  docker:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: meldry/padmin

      - name: Check out Glory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: glory-rs/glory
          ref: b9d06545c701510ba18d5cdb7cd363c102cad906
          path: glory-rs/main/glory

      - name: Check out Sapid
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sapid-ui/sapid
          ref: c5c4e23aeb6d37b3f2537545116bac43dbb40a64
          path: glory-rs/main/sapid

      - name: Build Glory and Sapid WASM on remote runner
        working-directory: meldry/padmin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PADMIN_BUILD_ROOT/tmp" "$PADMIN_BUILD_ROOT/cargo"
          export CARGO_HOME="$PADMIN_BUILD_ROOT/cargo"
          export CARGO_TARGET_DIR="$PADMIN_BUILD_ROOT/target"
          export TMPDIR="$PADMIN_BUILD_ROOT/tmp"
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          cargo install wasm-bindgen-cli --version 0.2.129 --locked --root "$PADMIN_BUILD_ROOT/tools"
          export WASM_BINDGEN="$PADMIN_BUILD_ROOT/tools/bin/wasm-bindgen"
          cargo metadata --locked --format-version 1 > "$PADMIN_BUILD_ROOT/canonical-metadata.json"
          python3 scripts/glory.py check
          python3 scripts/glory.py test
          python3 scripts/glory.py build
          mkdir -p "$PADMIN_BUILD_ROOT/container"
          cp -R "$PADMIN_BUILD_ROOT/dist" "$PADMIN_BUILD_ROOT/container/dist"
          cp Dockerfile docker-entrypoint.sh "$PADMIN_BUILD_ROOT/container/"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$DOCKERHUB_USERNAME" ] || [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "Both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured" >&2
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && env.DOCKERHUB_IMAGE || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ env.PADMIN_BUILD_ROOT }}/container
          file: ${{ env.PADMIN_BUILD_ROOT }}/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
